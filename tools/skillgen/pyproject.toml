[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2ui-skillgen"
version = "0.1.0"
description = "Generates A2UI skills (SKILL.md) from a component catalog."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only needed to run the parity tests against Google's reference generator.
parity = ["a2ui-agent-sdk>=0.5.0"]
dev = ["pytest>=8"]

[project.scripts]
skillgen = "skillgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
