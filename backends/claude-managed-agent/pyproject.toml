[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-a2ui-managed-agent"
version = "0.1.0"
description = "The Travel A2UI agent, run as an Anthropic-hosted Managed Agent."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Google's reference compiler. Optional because the published wheel is behind
# the current Express grammar — see express.py. When it catches up, this becomes
# the default path and the compile service is no longer needed.
sdk = ["a2ui-agent-sdk>=0.5.0"]
dev = ["pytest>=8"]

[project.scripts]
travel-agent-setup = "travel_agent.setup_agent:main"
travel-agent-serve = "travel_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
