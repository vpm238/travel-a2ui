name: travel_a2ui_flutter
description: >-
  The same agent, drawn by Flutter. A second renderer against one server, which
  is the claim the whole project exists to test.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # The official A2UI packages. The point of this client is that it renders the
  # protocol rather than this app's idea of it, so the core types and the
  # widget host both come from upstream.
  a2ui_core: ^0.1.1
  a2ui_flutter: 0.0.1-wip002

  http: ^1.2.0
  intl: any
  json_schema_builder: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Roboto, bundled rather than fetched.
  #
  # Flutter web's default theme asks for Roboto and the engine then downloads it
  # from `fonts.gstatic.com`, blocking the first frame until it arrives. On a
  # network that cannot reach Google the page loads, the engine starts, no error
  # is reported, and nothing ever paints — which is exactly how this was found.
  #
  # Naming a font the engine cannot resolve is worse: the layout appears and
  # every glyph is invisible. So it is bundled. Apache-2.0, the same licence as
  # this project, and 340 KB against a 40 MB engine.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
