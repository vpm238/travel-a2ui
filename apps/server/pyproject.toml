[project]
name = "travel-a2ui-server"
version = "0.1.0"
description = "The travel agent, server-side: A2UI out, React renderer in front."
requires-python = ">=3.11"

dependencies = [
  # The A2UI reference implementation. Compiling Express, pruning the catalog
  # and generating the skills all go through it rather than through a port —
  # which is the reason this server is Python: `agent_sdks/` upstream contains
  # exactly one language, and it is this one.
  #
  # Pinned exactly, both of them, and the second one is the point: `a2ui-core`
  # is a *transitive* dependency, and it is the one that broke us.
  #
  # `>=0.6.0` was an open upper bound, so every image build resolved to
  # whatever had shipped that morning. On 2026-09-28 at 17:39 UTC, agent-sdk
  # 0.7.0 and core 0.2.0 went out in the same minute; core 0.2.0 removes
  # `PayloadValidator.validate` — the whole-payload entry point — and splits it
  # into `validate_component` and `validate_function`. Both `express.py` and
  # `surfaces.py` call `.validate(messages)`, so every surface on the deployed
  # service died with "'PayloadValidator' object has no attribute 'validate'"
  # and the app drew nothing at all.
  #
  # Nothing caught it, and that is the more useful half of the story. A
  # developer machine and a CI runner with a warm environment both keep the
  # versions they already have; only a clean image build resolves afresh. So
  # the tests passed, the checks passed, the deploy went green, and the thing
  # that reached users was the only build that had ever installed 0.2.0.
  #
  # Adopting 0.2.0 is real work — the call sites have to move from one
  # whole-payload check to per-component and per-function ones — and it is not
  # work to do while the service is down. The pin comes first.
  "a2ui-agent-sdk==0.6.0",
  "a2ui-core==0.1.1",
  # Both Gemini surfaces this app uses: `client.interactions` for the typed
  # loop, `client.aio.live` for voice. The voice half replaces a hand-rolled
  # relay that had four bugs in it, three of them silent.
  "google-genai>=2.23.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_a2ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `asyncio_mode` goes back when the first async test does — pytest warns about
# an unknown option, and a warning nobody can act on trains people to ignore
# the ones they can.
