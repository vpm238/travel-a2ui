[project]
name = "travel-a2ui-server"
version = "0.1.0"
description = "The travel agent, server-side: A2UI v1.0 out, any A2UI renderer in front."
requires-python = ">=3.11"

dependencies = [
  # The A2UI Python SDK: the processor that writes the prompt snippet and
  # reads what the model writes, the macro expander, the renderer state that
  # validates every outbound message, and the skill generator.
  #
  # Pinned exactly, both, because they are pre-1.0 and release together: an
  # open range makes every image build an upgrade nobody reviewed, and
  # `a2ui-core` is a transitive dependency that has changed public APIs
  # between minor versions before. Bump them together, deliberately.
  "a2ui-agent-sdk==0.10.0",
  "a2ui-core==0.5.0",
  # Both Gemini surfaces this app uses: `client.interactions` for the typed
  # loop, `client.aio.live` for voice. Capped rather than pinned: these keep
  # compatibility across a minor, and a cap still takes security fixes.
  "google-genai>=2.25.0,<3",
  # Not 0.142, and the ceiling is load-bearing: FastAPI 0.142 wants
  # `opentelemetry-api>=1.44`, while `google-adk` — which arrives under
  # `a2ui-agent-sdk` — still caps it at `<=1.42.1`. Taking the newer FastAPI
  # makes the dependency set unresolvable. Raise this when adk's cap moves.
  "fastapi>=0.115,<0.142",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_a2ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `asyncio_mode` goes back when the first async test does — pytest warns about
# an unknown option, and a warning nobody can act on trains people to ignore
# the ones they can.
