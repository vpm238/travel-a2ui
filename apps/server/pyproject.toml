[project]
name = "travel-a2ui-server"
version = "0.1.0"
description = "The travel agent, server-side: A2UI v1.0 out, any A2UI renderer in front."
requires-python = ">=3.11"

dependencies = [
  # The A2UI Python SDK: the processor that writes the prompt snippet and
  # reads what the model writes, the macro expander, the renderer state that
  # validates every outbound message, and the skill generator.
  #
  # Pinned exactly, both: they are pre-1.0 and release together, so an open
  # range would make every image build an unreviewed upgrade. Bump them
  # together.
  "a2ui-agent-sdk==0.10.0",
  "a2ui-core==0.5.0",
  # Both Gemini surfaces this app uses: `client.interactions` for the typed
  # loop, `client.aio.live` for voice. Capped rather than pinned: these keep
  # compatibility across a minor, and a cap still takes security fixes.
  "google-genai>=2.25.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff==0.17.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_a2ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `asyncio_mode` goes back when the first async test does — pytest warns about
# an unknown option, and a warning nobody can act on trains people to ignore
# the ones they can.
