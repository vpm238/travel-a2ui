<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Travel A2UI — an agent that answers in interfaces</title>
    <meta
      name="description"
      content="A travel planner whose backend is a managed agent. It replies with real interactive UI, generated turn by turn with Google's A2UI protocol."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🧭%3C/text%3E%3C/svg%3E" />
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      try {
        const stored = localStorage.getItem('travel-a2ui:theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
