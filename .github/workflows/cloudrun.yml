name: travel-a2ui Cloud Run

# Deploys the Python server — which also serves the built React client and the
# Flutter client — to a single Cloud Run service.
#
# One service, not two: splitting the front end from the API would buy no
# independent scaling or release cadence, and would cost a CORS configuration
# and a class of bug where the two halves are different versions of the app.
#
# It deploys only what CI passed: it runs when "travel-a2ui CI" completes
# successfully on `main`, and builds the commit that CI tested.

on:
  workflow_run:
    workflows: ['travel-a2ui CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Cloud Run service name'
        required: false
        default: 'travel-a2ui'

permissions:
  contents: read
  # Required for Workload Identity Federation: the token this mints is what
  # Google exchanges for short-lived credentials. No service-account JSON key
  # is stored anywhere, which is the point — a long-lived key in a repository
  # secret is a credential that cannot be rotated by anyone who finds it
  # leaked.
  id-token: write

concurrency:
  group: travel-a2ui-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    # A CI run that failed, or ran for a push to another branch, deploys nothing.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # The commit CI tested, not whatever `main` points at by now.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Check the deployment is configured
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            # Said here rather than left to `gcloud` to fail obscurely three
            # minutes into a build.
            echo "Not configured for Cloud Run. Missing: ${missing[*]}" >&2
            echo "See docs/deploying.md for what each one is and" >&2
            echo "how to create the Workload Identity pool." >&2
            exit 1
          fi
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build and push the image
        run: |
          set -euo pipefail
          region="${{ vars.GCP_REGION }}"
          project="${{ vars.GCP_PROJECT_ID }}"
          service="${{ inputs.service || 'travel-a2ui' }}"
          image="${region}-docker.pkg.dev/${project}/${service}/server"

          gcloud auth configure-docker "${region}-docker.pkg.dev" --quiet

          # The previous image as a layer cache. The build installs the Flutter
          # SDK and resolves two package graphs, none of which changes between
          # most pushes — without this every deploy pays for all of it, and a
          # one-line prompt edit costs the same as a rewrite. `|| true` because
          # the very first deploy has nothing to pull.
          docker pull "${image}:latest" || true

          # Tagged with the commit as well as `latest`, so a rollback names a
          # commit rather than "the one before this one".
          DOCKER_BUILDKIT=1 docker build \
            --cache-from "${image}:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "${image}:${DEPLOY_SHA}" -t "${image}:latest" .
          docker push "${image}:${DEPLOY_SHA}"
          docker push "${image}:latest"

          echo "IMAGE=${image}:${DEPLOY_SHA}" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          # Optional. Set it and the maps draw; leave it unset and `GoogleMap`
          # says so on screen rather than failing. A Maps key is restricted by
          # HTTP referrer rather than kept secret — the browser is what loads
          # the library — so it is served to the page from `/api/meta`.
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # The identity the service runs as. A dedicated account with no
          # project roles is what it should be; without one, Cloud Run uses the
          # default compute account (see docs/deploying.md).
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          # `--update-env-vars`, not `--set-env-vars`: set replaces the service's
          # whole environment, which would drop a GEMINI_API_KEY or
          # ALLOWED_ORIGINS set on the service by hand.
          env_vars="PUBLIC_NAME=Travel A2UI"
          if [ -n "${MAPS_KEY:-}" ]; then
            env_vars="${env_vars},GOOGLE_MAPS_API_KEY=${MAPS_KEY}"
          fi

          identity=()
          if [ -n "${RUNTIME_SERVICE_ACCOUNT:-}" ]; then
            identity=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          else
            echo "::warning::RUNTIME_SERVICE_ACCOUNT is not set; the service runs as the default compute account."
          fi

          gcloud run deploy "${{ inputs.service || 'travel-a2ui' }}" \
            "${identity[@]}" \
            --image "${IMAGE}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --platform managed \
            --port 8080 \
            --cpu 1 \
            --memory 1Gi \
            --timeout 600 \
            --concurrency 40 \
            --min-instances 0 \
            --max-instances 1 \
            --update-env-vars "${env_vars}"

          # `--max-instances 1` is not a cost control, it is a correctness one.
          # Sessions live in this process's memory (see `sessions.py`), so a
          # second instance would hold a second set of conversations and a
          # traveller whose next request landed on it would find their trip
          # gone. Raising it means putting the sessions somewhere shared first.
          #
          # `--timeout 600` because a turn is a streamed SSE response held open
          # for as long as the model takes; the 5-minute default cuts a slow
          # one off mid-answer.
          #
          # No GEMINI_API_KEY is set. The key arrives with each request and
          # leaves with it, which is what lets this be a public demo that costs
          # its owner nothing and stores nobody's credential.

      - name: Say where it went
        run: |
          url=$(gcloud run services describe "${{ inputs.service || 'travel-a2ui' }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(status.url)')
          echo "Deployed to ${url}" | tee -a "$GITHUB_STEP_SUMMARY"

          # A deploy that returns 200 on the health check is a deploy; one that
          # merely finished is a hope.
          #
          # Checked into a variable rather than piped. `curl -f … | tee` reports
          # the *pipeline's* status, which is tee's, so the first run of this
          # printed "curl: (22) 404" and passed the step anyway — the one check
          # meant to catch a broken deploy was the one that could not fail.
          #
          # `/api/healthz`, not `/healthz`: Google's frontend answers the bare
          # path with its own 404 and the container never sees the request.
          if body=$(curl -fsS --max-time 30 "${url}/api/healthz"); then
            echo "$body" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Health check failed against ${url}/api/healthz" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
