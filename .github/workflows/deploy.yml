name: travel-a2ui deploy

# Deploys the Worker — which also serves the built React app and the MCP
# endpoint — to Cloudflare. One deploy, one origin.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN    a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID   from the Workers dashboard sidebar
#
# By default every visitor brings their own key, which is the safer choice for a
# public URL. To run a shared deployment on one key instead, set it once by hand
# rather than through this workflow — a secret that passes through a build log is
# a secret you have to rotate:
#
#   npx wrangler secret put ANTHROPIC_API_KEY --cwd apps/worker

on:
  push:
    branches: [main]
    paths: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-a2ui-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Never ship a build that does not pass. A deploy workflow that skips the
      # tests is a deploy workflow that eventually ships a broken compiler.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy the Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy

      # The real URL, in the job summary, so nobody has to dig through wrangler's
      # output or guess their subdomain to find what they just shipped.
      - name: Where it went
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          BASE="${URL:-https://travel-a2ui.<your-subdomain>.workers.dev}"
          {
            echo "### Deployed"
            echo
            echo "The app, the API and the MCP endpoint share one origin:"
            echo
            echo "- app: $BASE"
            echo "- MCP: \`$BASE/mcp\`"
            echo
            echo 'Install it in Claude Code:'
            echo
            echo '```'
            echo "claude mcp add --transport http travel-a2ui $BASE/mcp"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Prove the thing that was just deployed actually answers, rather than
      # trusting that a successful upload means a working server.
      - name: Smoke-test the deployment
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          BASE="${URL:-}"
          if [ -z "$BASE" ]; then
            echo "No deployment URL to check; skipping." && exit 0
          fi
          for path in /api/meta /.well-known/mcp.json /mcp-view/app.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$BASE$path returned $code"; exit 1; }
          done
          npx playwright install --with-deps chromium
          BASE_URL="$BASE" CHROMIUM_PATH='' node tools/e2e/mcp.mjs
