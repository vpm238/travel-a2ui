name: travel-a2ui CI

on:
  push:
    branches: ['**']
    paths: ['**']
  pull_request:
    paths: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-a2ui-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  #: The published SDK, and the one `apps/server/pyproject.toml` pins.
  #:
  #: This used to be a *git commit* — the one that merged `SkillGenerator`,
  #: because no release carried it. That made CI build the prompt with one SDK
  #: while the image ran another, which is why `check:skills` reported stale
  #: for weeks against a repository that was perfectly consistent with itself.
  #: 0.9.0 carries `SkillGenerator`, so the comment that said "swap this block
  #: the day a release carries a2ui.skill" has had its day.
  A2UI_SDK: "a2ui-agent-sdk==0.9.0"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      # The wheel, not a git checkout — so the SDK that generates the prompt
      # here is the SDK the image runs. The ANTLR toolchain went with the
      # source build: a published wheel ships its parser already generated,
      # which also takes a minute and a flaky download out of every run.
      #
      # The server package comes too, because the generators import it now:
      # one `load_catalog` that knows how this SDK wants a catalog loaded,
      # rather than the incantation repeated in four scripts.
      #
      # `-e`, and not as a preference: `travel_a2ui.ROOT` is four directories up
      # from `__init__.py`, which is the repository when the package is read
      # from `apps/server/src` and a path inside the virtualenv when it is
      # copied into site-packages. `brain/catalog.py` reads the catalog at
      # import time, so a non-editable install made every generator that
      # imports it look for `catalogs/a2ui-travel/catalog.json` somewhere that
      # has no catalogs directory at all — which is what "10-inline-flight-
      # options.express does not compile: FileNotFoundError" was. The image
      # installs it `-e` for the same reason (see the Dockerfile), so this is
      # also the rule the previous commit was applying: install it the way the
      # image does.
      - name: A2UI agent SDK
        run: |
          python3 -m pip install --quiet "${{ env.A2UI_SDK }}" -e ./apps/server
          python3 -c "from a2ui.skill import SkillGenerator; print('SkillGenerator ready')"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Three artifacts in this repo are generated, and a stale one is a silent
      # lie: a catalog the skills no longer describe, an example that no longer
      # compiles, a skill missing a component the renderer supports. Each check
      # regenerates and diffs rather than trusting the commit.
      #
      # One step each so a failure names the artifact that drifted, but the
      # commands live in package.json. When they were spelled out here too the
      # copies diverged, and CI checked the skills against an unpruned catalog
      # and reported all three as stale.
      - name: Catalog is current
        run: npm run check:catalog

      - name: Examples compile and their JSON is current
        run: npm run check:examples

      - name: Skills are current
        run: npm run check:skills

      # The prompt is assembled from markdown people edit on purpose, so its
      # golden is the one that is *meant* to move — and the one most likely to
      # be edited without being re-recorded. That is a failed build here rather
      # than a mystery a week later.
      - name: The prompt matches its golden
        run: python3 tools/parity/capture.py --check

      - name: Python tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/tests -q

      - name: Build
        run: npm run build

      # The server itself. Separate from the tooling tests above because it
      # needs the app's own dependencies, and because a failure here is a
      # failure of the thing that ships rather than of a build script.
      - name: The Python server
        run: |
          python3 -m pip install --quiet -e ./apps/server
          python3 -m pip install --quiet pytest httpx
          python3 -m pytest apps/server/tests -q

      # The two browser paths, against one dev server and a scripted model, so
      # they need no API key and cost nothing:
      #
      #   chat.mjs  a whole turn — typing, streaming, a surface appearing,
      #             clicking it, the click becoming the next turn.
      #   interaction.mjs
      #             the rules that decide whether the app feels coherent:
      #             editing sends nothing, committing sends everything once,
      #             answered surfaces go grey and inert, and what you set on
      #             one card is pre-filled on the next.
      - name: End-to-end
        run: |
          npx playwright install --with-deps chromium
          # The real server with a scripted model in place of Gemini, so this
          # needs no API key and costs nothing to run — which is the only way an
          # end-to-end test actually gets run. Everything else in the process is
          # the real thing: the real agent events, the real surface passes, the
          # real SSE transport, the real static mounts.
          pip install --quiet -e ./apps/server
          GEMINI_API_KEY=scripted python3 tools/e2e/scripted_server.py 8131 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8131/api/meta >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8131/api/meta >/dev/null || {
            echo "The server never came up." >&2; exit 1;
          }
          export BASE_URL=http://127.0.0.1:8131
          node tools/e2e/chat.mjs
          node tools/e2e/interaction.mjs
          node tools/e2e/frameworks.mjs
        env:
          # Let Playwright use the browser it just installed.
          CHROMIUM_PATH: ''

      # The component reference is generated from the catalog and the gallery
      # build, so it goes stale the moment either changes — and a reference page
      # that is quietly wrong is worse than no reference page. Here rather than
      # beside the other `check:` steps because it needs the browser installed
      # above. It compares the generated markdown and that every screenshot
      # exists, not image bytes, so it does not flake on a font.
      - name: The catalog reference is current
        run: npm run check:catalog-page
        env:
          CHROMIUM_PATH: ''

  reference-parity:
    name: Parity with google/a2ui
    runs-on: ubuntu-latest
    # The reference SDK pulls in the whole ADK dependency tree, so it runs in
    # its own job rather than slowing every build. It is the check that keeps
    # the TypeScript compiler and the Python signature generator honest — a
    # port nobody diffs is a fork.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install the reference A2UI SDK
        run: python3 -m pip install --quiet pytest a2ui-agent-sdk

      - name: Signature generation matches the reference
        run: python3 -m pytest tools/tests/test_sdk_parity.py -q

      # Compare the goldens against the *installed* reference compiler. This is
      # what notices when upstream changes, which no offline test can.
      #
      # Reported rather than enforced, on purpose, and deliberately *unpinned*:
      # this is the one step that is supposed to move when upstream does, which
      # is the whole reason it exists.
      #
      # It was written when the published wheel was 0.5.0 and rejected keyword
      # arguments outright, so the goldens could not match it and the job would
      # have been red forever. 0.9.0 parses them — the host's own surface
      # builders are written in them — so a mismatch here is now worth reading
      # rather than worth ignoring. The enforcement still lives in
      # packages/express/test/parity.test.ts, which is green and blocking.
      - name: Compare the goldens with the installed reference compiler
        run: |
          python3 scripts/gen_parity.py --check | tee "$GITHUB_STEP_SUMMARY" || true
