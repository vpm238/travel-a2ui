name: travel-a2ui CI

on:
  push:
    branches: ['**']
    paths: ['**']
  pull_request:
    paths: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-a2ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      # The wheel, not a git checkout — so the SDK that generates the prompt
      # here is the SDK the image runs. The ANTLR toolchain went with the
      # source build: a published wheel ships its parser already generated,
      # which also takes a minute and a flaky download out of every run.
      #
      # The server package comes too, because the generators import it now:
      # one `load_catalog` that knows how this SDK wants a catalog loaded,
      # rather than the incantation repeated in four scripts.
      #
      # `-e`, and not as a preference: `travel_a2ui.ROOT` is four directories up
      # from `__init__.py`, which is the repository when the package is read
      # from `apps/server/src` and a path inside the virtualenv when it is
      # copied into site-packages. `brain/catalog.py` reads the catalog at
      # import time, so a non-editable install made every generator that
      # imports it look for `catalogs/a2ui-travel/catalog.json` somewhere that
      # has no catalogs directory at all — which is what "10-inline-flight-
      # options.express does not compile: FileNotFoundError" was. The image
      # installs it `-e` for the same reason (see the Dockerfile), so this is
      # also the rule the previous commit was applying: install it the way the
      # image does.
      # Installed from `apps/server/pyproject.toml`, with no version named
      # here.
      #
      # This step used to pin its own: a git commit once, then
      # `a2ui-agent-sdk==0.9.0`. Both are a second place that decides which SDK
      # this repo builds against. The first spelling had CI build the prompt
      # with one SDK while the image ran another, and `check:skills` reported
      # stale for weeks against a repository that was perfectly consistent with
      # itself. The second had pyproject move to 0.10.0 while this line stayed
      # at 0.9.0, so pip was handed both in one command and CI went red on a
      # commit whose every suite was green.
      #
      # `-e ./apps/server` installs exactly what the image installs, because it
      # reads the same file. One answer, and the next bump is one line.
      - name: A2UI agent SDK
        run: |
          python3 -m pip install --quiet -e ./apps/server
          python3 -c "from a2ui.skill import SkillGenerator; print('SkillGenerator ready')"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Three artifacts in this repo are generated, and a stale one is a silent
      # lie: a catalog the skills no longer describe, an example that no longer
      # compiles, a skill missing a component the renderer supports. Each check
      # regenerates and diffs rather than trusting the commit.
      #
      # One step each so a failure names the artifact that drifted, but the
      # commands live in package.json. When they were spelled out here too the
      # copies diverged, and CI checked the skills against an unpruned catalog
      # and reported all three as stale.
      - name: Catalog is current
        run: npm run check:catalog

      - name: Examples compile and their JSON is current
        run: npm run check:examples

      - name: Skills are current
        run: npm run check:skills

      # What the Catalog view shows: every component's signature and a working
      # example, compiled by the SDK at build time instead of by a compiler
      # shipped to the browser.
      - name: The catalog reference is current
        run: npm run check:reference

      # The prompt is assembled from markdown people edit on purpose, so its
      # golden is the one that is *meant* to move — and the one most likely to
      # be edited without being re-recorded. That is a failed build here rather
      # than a mystery a week later.
      - name: The prompt matches its golden
        run: python3 tools/parity/capture.py --check

      # The pre-draw the Flutter client's tests assert against, captured from
      # the host's own macros. It is checked here and not beside the other
      # `check:` steps because it needs the server package, which the step
      # above installs.
      - name: The host's skeleton golden is current
        run: python3 tools/parity/skeleton.py --check

      - name: Python tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/tests -q

      - name: Build
        run: npm run build

      # The server itself. Separate from the tooling tests above because it
      # needs the app's own dependencies, and because a failure here is a
      # failure of the thing that ships rather than of a build script.
      - name: The Python server
        run: |
          python3 -m pip install --quiet -e ./apps/server
          python3 -m pip install --quiet pytest httpx
          python3 -m pytest apps/server/tests -q

      # The two browser paths, against one dev server and a scripted model, so
      # they need no API key and cost nothing:
      #
      #   chat.mjs  a whole turn — typing, streaming, a surface appearing,
      #             clicking it, the click becoming the next turn.
      #   interaction.mjs
      #             the rules that decide whether the app feels coherent:
      #             editing sends nothing, committing sends everything once,
      #             answered surfaces go grey and inert, and what you set on
      #             one card is pre-filled on the next.
      - name: End-to-end
        run: |
          npx playwright install --with-deps chromium
          # The real server with a scripted model in place of Gemini, so this
          # needs no API key and costs nothing to run — which is the only way an
          # end-to-end test actually gets run. Everything else in the process is
          # the real thing: the real agent events, the real surface passes, the
          # real SSE transport, the real static mounts.
          pip install --quiet -e ./apps/server
          GEMINI_API_KEY=scripted python3 tools/e2e/scripted_server.py 8131 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8131/api/meta >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8131/api/meta >/dev/null || {
            echo "The server never came up." >&2; exit 1;
          }
          export BASE_URL=http://127.0.0.1:8131
          node tools/e2e/chat.mjs
          node tools/e2e/interaction.mjs
          node tools/e2e/frameworks.mjs
          # Its own servers, because what it tests is what the server holds:
          # nothing at all, and a key the browser was never given.
          node tools/e2e/keys.mjs
          # And the sample trip a first visit opens on, which every other suite
          # turns off so that it starts from an empty conversation.
          node tools/e2e/sample.mjs
        env:
          # Let Playwright use the browser it just installed.
          CHROMIUM_PATH: ''

      # The component reference is generated from the catalog and the web
      # app's /catalog/<Name> pages, so it goes stale the moment either
      # changes — and a reference page that is quietly wrong is worse than no
      # reference page. Here rather than
      # beside the other `check:` steps because it needs the browser installed
      # above. It compares the generated markdown and that every screenshot
      # exists, not image bytes, so it does not flake on a font.
      - name: The catalog reference is current
        run: npm run check:catalog-page
        env:
          CHROMIUM_PATH: ''

  reference-parity:
    name: Parity with google/a2ui
    runs-on: ubuntu-latest
    # The reference SDK pulls in the whole ADK dependency tree, so it runs in
    # its own job rather than slowing every build. It keeps the Python
    # signature generator honest against the latest reference. (There is no
    # TypeScript compiler left to diff: the browser renders with @a2ui/web_core
    # and every compile, at build time and at runtime, is the SDK's.)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      # The server package, then the SDK floated to whatever upstream has
      # published: installing the server pins the SDK, so the upgrade after it
      # is what compares the signature generator with the *latest* reference.
      - name: Install the reference A2UI SDK
        run: |
          python3 -m pip install --quiet pytest -e ./apps/server
          python3 -m pip install --quiet --upgrade a2ui-agent-sdk

      - name: Signature generation matches the reference
        run: python3 -m pytest tools/tests/test_sdk_parity.py -q

  quickstart:
    name: The quickstart site
    runs-on: ubuntu-latest
    # `docs/site`: the A2UI quickstart, and the prompt a coding agent follows
    # to tour this repository. A tour that names a file which has since moved
    # sends someone's agent hunting for it, so every path it names is checked.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Every path the tour names exists
        run: |
          missing=0
          for file in docs/site/src/prompts/quickstart.md docs/site/src/content/docs/quickstart.mdx; do
            for path in $(grep -oE '`[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]*`' "$file" | tr -d '`' | sort -u); do
              case "$path" in *...*|*\**) continue ;; esac
              # The page abbreviates server paths, and says so under the table.
              if [ ! -e "$path" ] && [ ! -e "apps/server/src/travel_a2ui/$path" ]; then
                echo "::error file=$file::names $path, which does not exist"
                missing=1
              fi
            done
          done
          exit $missing

      - name: Build
        working-directory: docs/site
        run: |
          npm ci
          npm run build

      - name: The agent-facing files are there
        working-directory: docs/site
        run: |
          for file in quickstart/agent.md quickstart/prompt.md quickstart.md llms.txt llms-full.txt; do
            test -s "dist/$file" || { echo "::error::dist/$file is missing or empty"; exit 1; }
          done
          # What an agent is pointed at is the guide itself, not a page about
          # it, at the canonical address and the one it was first published at.
          cmp -s dist/quickstart/agent.md src/prompts/quickstart.md
          cmp -s dist/quickstart/prompt.md src/prompts/quickstart.md


  flutter:
    name: The Flutter client
    runs-on: ubuntu-latest
    # Its own job because it needs a 1.5GB SDK nothing else here wants, and
    # because a failure should say "the Flutter client" rather than hide in a
    # build log.
    #
    # It was not tested at all until the client was ported to A2UI 1.0, and the
    # gap cost exactly what an untested renderer costs. `a2ui_core` 0.4 hands a
    # resolved property back wrapped in a `ResolvedBinding`; every reader in
    # `components.dart` took the wrapper for the value, so a Text drew the
    # characters `ResolvedBinding(Madrid)`, `number()` returned null, every
    # button fell through to its fallback caption, and every editor wrote the
    # traveller's answer nowhere. None of it threw. `flutter build web` — the
    # only Flutter step there was, and only in the image — compiled all of it
    # without a word, because none of it is a type error.
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # The version the image builds with. They have to agree, or this job
          # is green against an SDK the deployment does not use.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: renderers/flutter
        run: flutter pub get

      # Analysis before tests: it is faster, and it catches the SDK bumps that
      # rename an API outright, which is the other half of what a renderer
      # against a moving protocol gets wrong.
      - name: Analyze
        working-directory: renderers/flutter
        run: flutter analyze

      - name: Test
        working-directory: renderers/flutter
        run: flutter test

      # What the image actually does with this package. Kept so a change that
      # passes the tests but cannot be compiled for the web fails here rather
      # than in a deployment.
      - name: Build for the web
        working-directory: renderers/flutter
        # Under `/flutter/`, where the server mounts it and the browser test
        # below loads it.
        run: flutter build web --release --base-href=/flutter/

      # The client in a real browser, against the real server with a scripted
      # model: boot, the catalog fetch, a streamed turn, the rows filling in, a
      # press, and the trip opening as a cart. Phone-sized, and again on a
      # desktop where it draws inside a phone frame.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: In a browser, against the server
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet -e ./apps/server
          GEMINI_API_KEY=scripted python3 tools/e2e/scripted_server.py 8130 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8130/api/meta >/dev/null && break
            sleep 2
          done
          node tools/e2e/flutter.mjs
          curl -sf -X POST http://127.0.0.1:8130/__test__/reset
          FLUTTER_VIEWPORT=1440x900 node tools/e2e/flutter.mjs
        env:
          CHROMIUM_PATH: ''
