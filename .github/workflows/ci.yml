name: travel-a2ui CI

on:
  push:
    branches: ['**']
    paths: ['**']
  pull_request:
    paths: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-a2ui-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  #: The commit that merged SkillGenerator (a2ui-project/a2ui#2516).
  A2UI_SDK_REF: d27d708

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      # The skill generator is the SDK's now, and `SkillGenerator` is merged
      # upstream but not yet in a published wheel — so this pins the commit it
      # landed in rather than tracking main, where an unrelated change could
      # rewrite our prompt without a commit here.
      #
      # It builds from source because the sdist regenerates its ANTLR parser,
      # which is why antlr4-tools and a JDK are here; ubuntu-latest already has
      # the JDK. Swap the whole block for `pip install a2ui-agent-sdk` the day
      # a release carries a2ui.skill.
      # `antlr4-tools` does not ship the ANTLR jar — it downloads it from
      # antlr.org the first time the generator runs, which is *inside* the
      # sdist build. So a flaky minute on the network reads as "ANTLR parser
      # generation failed (exit code 1)" with nothing about a download in it.
      # Cached across runs, then warmed with retries, so the usual run fetches
      # nothing and an unlucky one gets three chances.
      - name: Cache the ANTLR jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/antlr
          key: antlr-${{ runner.os }}-${{ env.A2UI_SDK_REF }}

      - name: A2UI agent SDK
        run: |
          python3 -m pip install --quiet antlr4-tools hatchling

          for attempt in 1 2 3; do
            antlr4 2>/dev/null | head -1 && break
            echo "ANTLR jar not available (attempt $attempt); retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done

          for attempt in 1 2 3; do
            python3 -m pip install --quiet --no-build-isolation \
              "a2ui-agent-sdk @ git+https://github.com/a2ui-project/a2ui@${{ env.A2UI_SDK_REF }}#subdirectory=agent_sdks/python/a2ui_agent" && break
            echo "SDK build failed (attempt $attempt); retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done

          python3 -c "from a2ui.skill import SkillGenerator; print('SkillGenerator ready')"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Three artifacts in this repo are generated, and a stale one is a silent
      # lie: a catalog the skills no longer describe, an example that no longer
      # compiles, a skill missing a component the renderer supports. Each check
      # regenerates and diffs rather than trusting the commit.
      #
      # One step each so a failure names the artifact that drifted, but the
      # commands live in package.json. When they were spelled out here too the
      # copies diverged, and CI checked the skills against an unpruned catalog
      # and reported all three as stale.
      - name: Catalog is current
        run: npm run check:catalog

      # A Worker has no filesystem, so `data/` travels in the bundle as a
      # generated module. Editing a CSV and forgetting to regenerate would ship
      # the old rows silently — the app would work, with last week's data.
      - name: Fixtures match data/
        run: npm run check:fixtures

      - name: Examples compile and their JSON is current
        run: npm run check:examples

      - name: Skills are current
        run: npm run check:skills

      - name: Python tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/tests -q

      - name: Build
        run: npm run build

      # The two browser paths, against one dev server and a scripted model, so
      # they need no API key and cost nothing:
      #
      #   chat.mjs  a whole turn — typing, streaming, a surface appearing,
      #             clicking it, the click becoming the next turn.
      #   interaction.mjs
      #             the rules that decide whether the app feels coherent:
      #             editing sends nothing, committing sends everything once,
      #             answered surfaces go grey and inert, and what you set on
      #             one card is pre-filled on the next.
      #   mcp.mjs   a real JSON-RPC tool call, rendered inside a sandboxed
      #             iframe the way an MCP host renders it, plus a layout
      #             composed on the fly from the component reference.
      - name: End-to-end
        run: |
          npx playwright install --with-deps chromium
          (cd apps/worker && npx wrangler dev --port 8787 --ip 127.0.0.1 &)
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/meta >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8787/api/meta >/dev/null || {
            echo "The dev server never came up." >&2; exit 1;
          }
          node tools/e2e/chat.mjs
          node tools/e2e/interaction.mjs
          node tools/e2e/frameworks.mjs
          node tools/e2e/mcp.mjs
        env:
          # Let Playwright use the browser it just installed.
          CHROMIUM_PATH: ''
          CLOUDFLARE_API_TOKEN: ''

      # The component reference is generated from the catalog and the gallery
      # build, so it goes stale the moment either changes — and a reference page
      # that is quietly wrong is worse than no reference page. Here rather than
      # beside the other `check:` steps because it needs the browser installed
      # above. It compares the generated markdown and that every screenshot
      # exists, not image bytes, so it does not flake on a font.
      - name: The catalog reference is current
        run: npm run check:catalog-page
        env:
          CHROMIUM_PATH: ''

  reference-parity:
    name: Parity with google/a2ui
    runs-on: ubuntu-latest
    # The reference SDK pulls in the whole ADK dependency tree, so it runs in
    # its own job rather than slowing every build. It is the check that keeps
    # the TypeScript compiler and the Python signature generator honest — a
    # port nobody diffs is a fork.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install the reference A2UI SDK
        run: python3 -m pip install --quiet pytest a2ui-agent-sdk

      - name: Signature generation matches the reference
        run: python3 -m pytest tools/tests/test_sdk_parity.py -q

      # Compare the goldens against the *installed* reference compiler. This is
      # what notices when upstream changes, which no offline test can.
      #
      # Reported rather than enforced, on purpose. The published wheel (0.5.0)
      # is behind the grammar the skills teach — it rejects keyword arguments
      # outright — so the goldens cannot match it and the job would be red
      # forever, which teaches nobody anything. The enforcement lives in
      # packages/express/test/parity.test.ts, which is green and blocking. This
      # step exists to make a *new* divergence visible in the log the day the
      # wheel catches up.
      - name: Compare the goldens with the installed reference compiler
        run: |
          python3 scripts/gen_parity.py --check | tee "$GITHUB_STEP_SUMMARY" || true
