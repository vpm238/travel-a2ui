name: travel-a2ui CI

on:
  push:
    branches: ['**']
    paths: ['**']
  pull_request:
    paths: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-a2ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - run: npm ci

      # The server package, editable, exactly as the image installs it: the
      # SDK version comes from `apps/server/pyproject.toml` alone, and the
      # generators import the server's own catalog and processor from the
      # repository (`travel_a2ui.ROOT` is the checkout only when editable).
      - name: A2UI agent SDK
        run: |
          python3 -m pip install --quiet -e ./apps/server
          python3 -c "from a2ui.skill import SkillGenerator; print('SkillGenerator ready')"

      - name: Lint and format
        run: |
          python3 -m pip install --quiet ruff==0.17.4
          npm run lint
          npm run format:check

      - name: Test
        run: npm test

      # The generated artifacts, each regenerated and diffed rather than
      # trusted: the catalog, the skills (from the server's own processor), the
      # Catalog view's reference, and the renderer fixtures. One step each so a
      # failure names what drifted; the commands live in package.json.
      - name: Catalog is current
        run: npm run check:catalog

      - name: Skills are current
        run: npm run check:skills

      # What the Catalog view shows: every component's signature and a working
      # example, compiled by the SDK at build time instead of by a compiler
      # shipped to the browser.
      - name: The catalog reference is current
        run: npm run check:reference

      # What the Flutter client's tests render, produced by the server's own
      # pipeline: a `Flights()` the model drew, and the rows a lookup returned.
      - name: The renderer fixtures are current
        run: npm run check:fixtures

      - name: Python tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/tests -q

      - name: Build
        run: npm run build

      # The server itself. Separate from the tooling tests above because it
      # needs the app's own dependencies, and because a failure here is a
      # failure of the thing that ships rather than of a build script.
      - name: The Python server
        run: |
          python3 -m pip install --quiet -e ./apps/server
          python3 -m pip install --quiet pytest httpx
          python3 -m pytest apps/server/tests -q

      # The browser suites, against the real server with a scripted model in
      # place of Gemini, so they need no key and cost nothing:
      #
      #   chat.mjs         a whole turn: typing, streaming, a surface, a press.
      #   interaction.mjs  editing sends nothing, a press sends the data model
      #                    once, answered surfaces go inert.
      #   frameworks.mjs   the runtime picker.
      #   keys.mjs         no key, and a key held by the server.
      #   sample.mjs       the recorded sample trip a first visit opens on.
      - name: End-to-end
        run: |
          npx playwright install --with-deps chromium
          pip install --quiet -e ./apps/server
          GEMINI_API_KEY=scripted python3 tools/e2e/scripted_server.py 8131 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8131/api/meta >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8131/api/meta >/dev/null || {
            echo "The server never came up." >&2; exit 1;
          }
          export BASE_URL=http://127.0.0.1:8131
          node tools/e2e/chat.mjs
          node tools/e2e/interaction.mjs
          node tools/e2e/frameworks.mjs
          # Starts its own servers: what it tests is what the server holds.
          node tools/e2e/keys.mjs
          node tools/e2e/sample.mjs
        env:
          # Let Playwright use the browser it just installed.
          CHROMIUM_PATH: ''

      # docs/catalog.md is generated from the catalog and the web app's
      # /catalog/<Name> pages. Here because it needs the browser installed
      # above; it compares the markdown and that every screenshot exists, not
      # image bytes.
      - name: The catalog reference is current
        run: npm run check:catalog-page
        env:
          CHROMIUM_PATH: ''

  newest-sdk:
    name: Against the newest A2UI SDK
    runs-on: ubuntu-latest
    # The newest published SDK, unpinned: catalog pruning and macros against
    # it, so an upstream change shows up here before a pin bump. Advisory.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - run: npm ci

      # The server package pins the SDK; the upgrade after it floats to the
      # newest published release.
      - name: Install the newest A2UI SDK
        run: |
          python3 -m pip install --quiet pytest -e ./apps/server
          python3 -m pip install --quiet --upgrade a2ui-agent-sdk

      - name: Pruning and macros hold on the newest SDK
        run: python3 -m pytest tools/tests/test_sdk_conformance.py -q

  quickstart:
    name: The quickstart site
    runs-on: ubuntu-latest
    # `docs/site`: the A2UI quickstart, and the prompt a coding agent follows
    # to tour this repository. A tour that names a file which has since moved
    # sends someone's agent hunting for it, so every path it names is checked.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Every path the tour names exists
        run: |
          missing=0
          for file in docs/site/src/prompts/quickstart.md docs/site/src/content/docs/quickstart.mdx; do
            for path in $(grep -oE '`[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]*`' "$file" | tr -d '`' | sort -u); do
              case "$path" in *...*|*\**) continue ;; esac
              # The page abbreviates server paths, and says so under the table.
              if [ ! -e "$path" ] && [ ! -e "apps/server/src/travel_a2ui/$path" ]; then
                echo "::error file=$file::names $path, which does not exist"
                missing=1
              fi
            done
          done
          exit $missing

      - name: Build
        working-directory: docs/site
        run: |
          npm ci
          npm run build

      - name: The agent-facing files are there
        working-directory: docs/site
        run: |
          for file in quickstart/agent.md quickstart/prompt.md quickstart.md llms.txt llms-full.txt; do
            test -s "dist/$file" || { echo "::error::dist/$file is missing or empty"; exit 1; }
          done
          # What an agent is pointed at is the guide itself, not a page about
          # it, at the canonical address and the one it was first published at.
          cmp -s dist/quickstart/agent.md src/prompts/quickstart.md
          cmp -s dist/quickstart/prompt.md src/prompts/quickstart.md


  flutter:
    name: The Flutter client
    runs-on: ubuntu-latest
    # Its own job: it needs the Flutter SDK, and a failure should name the
    # Flutter client.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # The version the image builds with. They have to agree, or this job
          # is green against an SDK the deployment does not use.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: renderers/flutter
        run: flutter pub get

      # Analysis first: it is faster, and catches an SDK bump that renames an API.
      - name: Analyze
        working-directory: renderers/flutter
        run: flutter analyze

      - name: Test
        working-directory: renderers/flutter
        run: flutter test

      # What the image does with this package.
      - name: Build for the web
        working-directory: renderers/flutter
        # Under `/flutter/`, where the server mounts it and the browser test
        # below loads it.
        run: flutter build web --release --base-href=/flutter/

      # The client in a real browser, against the real server with a scripted
      # model: boot, the catalog fetch, a streamed turn, the rows filling in, a
      # press, and the trip opening as a cart. Phone-sized, and again on a
      # desktop where it draws inside a phone frame.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: In a browser, against the server
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet -e ./apps/server
          GEMINI_API_KEY=scripted python3 tools/e2e/scripted_server.py 8130 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8130/api/meta >/dev/null && break
            sleep 2
          done
          node tools/e2e/flutter.mjs
          curl -sf -X POST http://127.0.0.1:8130/__test__/reset
          FLUTTER_VIEWPORT=1440x900 node tools/e2e/flutter.mjs
        env:
          CHROMIUM_PATH: ''
